<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --text: #1f2329;
      --muted: #646a73;
      --line: #e5e6eb;
      --soft: #f7f8fa;
      --accent: #3370ff;
      --decision: #f0f4ff;
      --todo: #fff7e6;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f4f6; color: var(--text); line-height: 1.65; }
    main { width: min(100% - 32px, 920px); margin: 32px auto; padding: 56px 64px; background: #fff; border-radius: 12px; box-shadow: 0 8px 32px rgb(31 35 41 / 8%); }
    h1 { margin: 0 0 10px; font-size: 32px; line-height: 1.3; }
    h2 { margin: 44px 0 18px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 24px; }
    h3 { margin: 28px 0 10px; font-size: 19px; }
    p, li { font-size: 16px; }
    .meta { color: var(--muted); font-size: 14px; }
    .notice { margin: 24px 0; padding: 12px 16px; border-radius: 8px; background: var(--soft); color: var(--muted); }
    .summary { padding: 20px 22px; border-left: 4px solid var(--accent); border-radius: 8px; background: var(--soft); }
    .visual { margin: 24px 0; padding: 18px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .visual img, .visual svg { display: block; width: 100%; height: auto; }
    .decision { padding: 16px 18px; border-radius: 8px; background: var(--decision); }
    .todo { padding: 16px 18px; border-radius: 8px; background: var(--todo); }
    blockquote { margin: 20px 0; padding: 4px 0 4px 18px; border-left: 3px solid var(--line); color: #373c43; }
    @media (max-width: 720px) {
      main { width: 100%; margin: 0; padding: 32px 22px; border-radius: 0; }
      h1 { font-size: 27px; }
      h2 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main data-meeting-minutes-preview>
    <h1>{{TITLE}}</h1>
    <p class="meta">{{META}}</p>
    <div class="notice">{{NOTICE}}</div>

    <h2>总结</h2>
    <section class="summary">{{SUMMARY_HTML}}</section>
    {{SUMMARY_VISUAL_HTML}}

    <h2>关键结论</h2>
    {{KEY_CONCLUSIONS_HTML}}

    <h2>待办</h2>
    <section class="todo">{{ACTION_ITEMS_HTML}}</section>

    <h2>智能章节</h2>
    {{CHAPTERS_HTML}}

    <h2>关键决策</h2>
    <section class="decision">{{DECISIONS_HTML}}</section>

    <h2>金句时刻</h2>
    {{QUOTES_HTML}}

    <h2>相关链接</h2>
    {{LINKS_HTML}}

    <h2>完整转录</h2>
    {{TRANSCRIPT_HTML}}
  </main>
</body>
</html>
